<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arsip Surat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#edf1f3; --surface:#ffffff; --surface-2:#f5f7f8; --line:#dbe3e8; --line-soft:#e8edf0;
  --ink:#1c2733; --muted:#5b6c7b; --side:#1f2d3a; --side-ink:#c9d5dd; --side-muted:#8fa2b0; --side-active:#2c3f50;
  --masuk:#2d7674; --masuk-soft:#deeeed; --masuk-ink:#1f5553;
  --keluar:#4b5c9c; --keluar-soft:#e5e8f5; --keluar-ink:#36467f;
  --primary:#2d6f78; --primary-hover:#255c64; --on-primary:#ffffff;
  --warn:#83601a; --warn-soft:#f6ecd6; --ok:#2c6a40; --ok-soft:#e0efe4; --info:#2f5f86; --info-soft:#e0ecf5;
  --mute:#4f5f6c; --mute-soft:#e8edf0; --danger:#a83f38; --danger-soft:#f8e3e1; --focus:#3b86a8;
  --shadow:0 1px 2px rgba(28,39,51,.05),0 6px 20px -8px rgba(28,39,51,.12);
  --scrim:rgba(20,30,40,.45);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11181e; --surface:#19222a; --surface-2:#1f2a33; --line:#2b3843; --line-soft:#232f39;
    --ink:#e5ecf1; --muted:#93a4b1; --side:#0d1317; --side-ink:#cbd7df; --side-muted:#7f92a0; --side-active:#1c2932;
    --masuk:#62bbb6; --masuk-soft:#1b3432; --masuk-ink:#8fd6d1;
    --keluar:#8fa1e2; --keluar-soft:#242a46; --keluar-ink:#b3c0f0;
    --primary:#62bbb6; --primary-hover:#7ccbc6; --on-primary:#0b1a19;
    --warn:#e2bf70; --warn-soft:#3a3018; --ok:#8fcfa2; --ok-soft:#1c3324; --info:#8fbde3; --info-soft:#1b2f42;
    --mute:#a4b3be; --mute-soft:#243039; --danger:#ee9a92; --danger-soft:#3e2523; --focus:#7cc0e0;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -10px rgba(0,0,0,.5);
    --scrim:rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#11181e; --surface:#19222a; --surface-2:#1f2a33; --line:#2b3843; --line-soft:#232f39;
  --ink:#e5ecf1; --muted:#93a4b1; --side:#0d1317; --side-ink:#cbd7df; --side-muted:#7f92a0; --side-active:#1c2932;
  --masuk:#62bbb6; --masuk-soft:#1b3432; --masuk-ink:#8fd6d1;
  --keluar:#8fa1e2; --keluar-soft:#242a46; --keluar-ink:#b3c0f0;
  --primary:#62bbb6; --primary-hover:#7ccbc6; --on-primary:#0b1a19;
  --warn:#e2bf70; --warn-soft:#3a3018; --ok:#8fcfa2; --ok-soft:#1c3324; --info:#8fbde3; --info-soft:#1b2f42;
  --mute:#a4b3be; --mute-soft:#243039; --danger:#ee9a92; --danger-soft:#3e2523; --focus:#7cc0e0;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -10px rgba(0,0,0,.5);
  --scrim:rgba(0,0,0,.6);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg{flex:none}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-ink);padding:24px 16px;display:flex;flex-direction:column;gap:28px;position:sticky;top:0;height:100vh;align-self:start}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px}
.brand-mark{width:42px;height:42px;border-radius:13px;background:linear-gradient(145deg,#3d8f8b,#2d6f78);display:grid;place-items:center;color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
.brand b{display:block;font-size:17px;font-weight:700;color:#fff;letter-spacing:-.01em}
.brand span{font-size:12.5px;color:var(--side-muted)}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border:0;border-radius:11px;background:transparent;color:var(--side-ink);text-align:left;font-weight:500;transition:background .15s}
.nav button:hover{background:rgba(255,255,255,.05)}
.nav button[aria-current="page"]{background:var(--side-active);color:#fff;font-weight:600;box-shadow:inset 3px 0 0 #62bbb6}
.nav .count{margin-left:auto;font-size:12.5px;font-weight:600;padding:1px 9px;border-radius:999px;background:rgba(255,255,255,.08);color:var(--side-ink)}
.main{padding:32px 36px 64px;max-width:1240px;width:100%}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.top .hello{font-size:13.5px;color:var(--muted);margin-bottom:2px}
.top h1{font-size:30px;font-weight:800;letter-spacing:-.025em;line-height:1.15}
.top-actions{display:flex;gap:10px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:11px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;transition:background .15s,border-color .15s,transform .05s}
.btn:hover{background:var(--surface-2);border-color:var(--muted)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.primary:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.danger:hover{filter:brightness(.92)}
.btn[disabled]{opacity:.6;cursor:progress}
.icon-btn{width:34px;height:34px;display:inline-grid;place-items:center;border-radius:9px;border:0;background:transparent;color:var(--muted);transition:background .15s,color .15s}
.icon-btn:hover{background:var(--mute-soft);color:var(--ink)}
.icon-btn.del:hover{background:var(--danger-soft);color:var(--danger)}

/* ---------- ringkasan ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;margin-bottom:24px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.stat{background:var(--surface);border:1px solid var(--line-soft);border-radius:18px;padding:18px;display:flex;gap:14px;align-items:center;box-shadow:var(--shadow)}
.stat .ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center}
.stat .ico.masuk{background:var(--masuk-soft);color:var(--masuk)}
.stat .ico.keluar{background:var(--keluar-soft);color:var(--keluar)}
.stat .ico.info{background:var(--info-soft);color:var(--info)}
.stat .ico.warn{background:var(--warn-soft);color:var(--warn)}
.stat b{display:block;font-size:28px;font-weight:800;line-height:1.1;letter-spacing:-.02em}
.stat span{font-size:13px;color:var(--muted)}
.chart{background:var(--surface);border:1px solid var(--line-soft);border-radius:18px;padding:18px 20px;box-shadow:var(--shadow);display:flex;flex-direction:column}
.chart h2{font-size:14.5px;font-weight:700}
.chart .legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-top:2px}
.chart .legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px}
.bars{display:flex;gap:10px;align-items:flex-end;flex:1;margin-top:14px;min-height:112px}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
.bpair{display:flex;align-items:flex-end;gap:4px;height:92px}
.bar{width:14px;border-radius:5px 5px 2px 2px;min-height:3px}
.bar.in{background:var(--masuk)}
.bar.out{background:var(--keluar)}
.bar.zero{opacity:.25}
.blabel{font-size:12px;color:var(--muted)}

/* ---------- toolbar ---------- */
.tools{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.search{flex:1 1 260px;position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.field,.search input,.select{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:11px;background:var(--surface);transition:border-color .15s,box-shadow .15s}
.search input{padding-left:42px}
.select{width:auto;min-width:150px;appearance:auto}
.select.dt{min-width:120px}
.field:focus,.search input:focus,.select:focus{outline:none;border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 25%,transparent)}

/* ---------- daftar ---------- */
.list{background:var(--surface);border:1px solid var(--line-soft);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.thead,.row{display:grid;grid-template-columns:44px minmax(0,2fr) minmax(0,1.3fr) 118px 210px 84px;gap:16px;align-items:center;padding:0 20px}
.thead{padding-top:12px;padding-bottom:12px;background:var(--surface-2);border-bottom:1px solid var(--line-soft);font-size:12.5px;font-weight:600;color:var(--muted)}
.row{padding-top:14px;padding-bottom:14px;border-bottom:1px dashed var(--line);cursor:pointer;transition:background .12s}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface-2)}
.tile{width:44px;height:44px;border-radius:13px;display:grid;place-items:center}
.tile.masuk{background:var(--masuk-soft);color:var(--masuk)}
.tile.keluar{background:var(--keluar-soft);color:var(--keluar)}
.r-main{min-width:0}
.r-main h3{font-size:15px;font-weight:650;line-height:1.35}
.title-btn{all:unset;cursor:pointer;display:block;font-weight:650;line-height:1.35;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.title-btn:hover{text-decoration:underline;text-underline-offset:3px}
.title-btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.r-main p{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-party{min-width:0}
.r-party .pfx{display:block;font-size:12px;color:var(--muted)}
.r-party .pname{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-date{font-size:13.5px;color:var(--ink)}
.r-stat{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.r-acts{display:flex;justify-content:flex-end;gap:2px}
.chip{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
.st-warn{background:var(--warn-soft);color:var(--warn)}
.st-info{background:var(--info-soft);color:var(--info)}
.st-ok{background:var(--ok-soft);color:var(--ok)}
.st-mute{background:var(--mute-soft);color:var(--mute)}
.tag{display:inline-flex;padding:3px 9px;border-radius:8px;font-size:12px;font-weight:600;border:1px solid currentColor;white-space:nowrap}
.tag.Penting{color:var(--info)} .tag.Segera{color:var(--danger)} .tag.Rahasia{color:var(--mute)}
.clip{color:var(--muted);display:inline-grid;place-items:center}

.empty{padding:56px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty .art{width:72px;height:72px;border-radius:22px;background:var(--masuk-soft);color:var(--masuk);display:grid;place-items:center;margin-bottom:6px}
.empty h2{font-size:19px;font-weight:700}
.empty p{color:var(--muted);max-width:420px}
.empty .btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.skel{padding:20px;display:grid;gap:14px}
.skel i{display:block;height:44px;border-radius:12px;background:linear-gradient(90deg,var(--surface-2),var(--line-soft),var(--surface-2));background-size:200% 100%;animation:sh 1.4s infinite linear}
@keyframes sh{to{background-position:-200% 0}}

/* ---------- layer: modal & drawer ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;display:flex;justify-content:center;align-items:center;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));animation:fade .18s ease-out}
.scrim.right{justify-content:flex-end;align-items:stretch;padding:0}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}}
@keyframes slide{from{transform:translateX(40px);opacity:0}}
.modal{width:min(720px,100%);max-height:100%;background:var(--surface);border-radius:20px;box-shadow:0 30px 80px -20px rgba(0,0,0,.45);display:flex;flex-direction:column;animation:pop .2s ease-out;overflow:hidden}
.modal.small{width:min(440px,100%)}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line-soft)}
.mhead h2{font-size:18px;font-weight:700}
.mbody{padding:20px 22px;overflow:auto;display:grid;gap:16px}
.mfoot{display:flex;justify-content:flex-end;gap:10px;padding:14px 22px;border-top:1px solid var(--line-soft);background:var(--surface-2)}
#lform{display:flex;flex-direction:column;min-height:0;flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fld label,.fld .lbl{display:block;font-size:13.5px;font-weight:600;margin-bottom:6px}
.fld .hint{font-size:12.5px;color:var(--muted);margin-top:5px}
.fld .err{font-size:12.5px;color:var(--danger);margin-top:5px;display:none}
.fld.bad .err{display:block}
.fld.bad .field{border-color:var(--danger)}
textarea.field{resize:vertical;min-height:84px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:5px;background:var(--surface-2);border:1px solid var(--line);border-radius:14px}
.seg label{margin:0;position:relative}
.seg input{position:absolute;opacity:0;inset:0;cursor:pointer}
.seg span{display:flex;align-items:center;justify-content:center;gap:8px;padding:10px;border-radius:10px;font-weight:600;color:var(--muted);transition:background .15s,color .15s}
.seg input:checked + span{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg input:checked + span.m{color:var(--masuk)}
.seg input:checked + span.k{color:var(--keluar)}
.seg input:focus-visible + span{outline:2px solid var(--focus);outline-offset:2px}
.drop{border:1.5px dashed var(--line);border-radius:14px;padding:22px;text-align:center;background:var(--surface-2);color:var(--muted);transition:border-color .15s,background .15s}
.drop.over{border-color:var(--masuk);background:var(--masuk-soft)}
.drop .linkbtn{all:unset;color:var(--primary);font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.drop .linkbtn:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.drop small{display:block;margin-top:4px;font-size:12.5px}
.filechip{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface-2)}
.filechip .fi{width:40px;height:40px;border-radius:11px;background:var(--info-soft);color:var(--info);display:grid;place-items:center}
.filechip .fn{min-width:0;flex:1}
.filechip .fn b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filechip .fn span{font-size:12.5px;color:var(--muted)}
.notice{padding:12px 14px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-size:13.5px}

.drawer{width:min(520px,100%);height:100%;background:var(--surface);display:flex;flex-direction:column;box-shadow:-20px 0 60px -20px rgba(0,0,0,.4);animation:slide .22s ease-out}
.dhead{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 14px 24px}
.dhead.masuk{background:var(--masuk-soft);color:var(--masuk-ink)}
.dhead.keluar{background:var(--keluar-soft);color:var(--keluar-ink)}
.dhead .jenis{display:flex;align-items:center;gap:10px;font-weight:700}
.dbody{padding:24px;overflow:auto;flex:1;display:grid;gap:22px;align-content:start}
.dbody h2{font-size:22px;font-weight:800;line-height:1.3;letter-spacing:-.015em}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.facts{margin:0;display:grid;grid-template-columns:1fr 1fr;gap:16px 20px;padding:18px 0;border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft)}
.facts dt{font-size:12.5px;color:var(--muted)}
.facts dd{margin:2px 0 0;font-weight:600;overflow-wrap:anywhere}
.facts .wide{grid-column:1/-1}
.sect h3{font-size:13.5px;font-weight:700;margin-bottom:6px}
.sect p{color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere}
.att-img{display:block;border-radius:14px;overflow:hidden;border:1px solid var(--line);margin-bottom:10px;background:var(--surface-2)}
.att-img img{display:block;width:100%;max-height:340px;object-fit:contain}
.att-actions{display:flex;gap:8px;flex-wrap:wrap}
.att-actions a.btn,.att-actions button.btn{padding:8px 14px;text-decoration:none;color:inherit}
.dfoot{display:flex;gap:10px;padding:14px 24px;border-top:1px solid var(--line-soft);background:var(--surface-2)}
.dfoot .grow{flex:1}
.btn.ghost-danger{color:var(--danger);border-color:transparent;background:transparent}
.btn.ghost-danger:hover{background:var(--danger-soft);border-color:transparent}

.toasts{position:fixed;left:0;right:0;bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:8px;z-index:80;pointer-events:none;padding:0 16px}
.toast{pointer-events:auto;display:flex;align-items:center;gap:10px;padding:11px 16px;border-radius:12px;background:#1f2d3a;color:#fff;font-weight:500;box-shadow:0 12px 30px -10px rgba(0,0,0,.5);animation:pop .2s ease-out}
.toast.err{background:var(--danger)}
.toast.ok svg{color:#7fd6a0}

/* ---------- responsif ---------- */
@media (max-width: 1000px){
  .hero{grid-template-columns:1fr}
}
@media (max-width: 900px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:14px 16px;gap:12px 16px}
  .nav{flex-direction:row;width:100%;overflow-x:auto;gap:6px;padding-bottom:2px}
  .nav button{width:auto;white-space:nowrap;padding:9px 14px}
  .nav button[aria-current="page"]{box-shadow:none}
  .main{padding:22px 16px 56px}
  .top h1{font-size:25px}
  .thead{display:none}
  .row{grid-template-columns:44px minmax(0,1fr) auto;grid-template-areas:"tile main acts" ". party party" ". date stat";gap:8px 12px;padding:14px 14px}
  .row .tile{grid-area:tile;align-self:start}
  .row .r-main{grid-area:main}
  .row .r-party{grid-area:party}
  .row .r-party .pfx{display:inline;margin-right:6px}
  .row .r-party .pname{display:inline}
  .row .r-date{grid-area:date;color:var(--muted)}
  .row .r-stat{grid-area:stat;justify-content:flex-end}
  .row .r-acts{grid-area:acts;align-self:start}
}
@media (max-width: 560px){
  .grid2{grid-template-columns:1fr}
  .stats{gap:12px}
  .stat{padding:14px;gap:10px}
  .stat b{font-size:24px}
  .stat .ico{width:40px;height:40px}
  .scrim{padding:0;align-items:flex-end}
  .modal{border-radius:20px 20px 0 0;max-height:94%}
  .facts{grid-template-columns:1fr}
  .top-actions{width:100%}
  .top-actions .btn{flex:1}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="brand-mark" id="brandMark"></div>
      <div><b>Arsip Surat</b><span>Masuk dan keluar</span></div>
    </div>
    <nav class="nav" id="nav" aria-label="Kategori surat"></nav>
  </aside>

  <main class="main">
    <header class="top">
      <div>
        <p class="hello" id="hello"></p>
        <h1 id="pageTitle">Semua surat</h1>
      </div>
      <div class="top-actions" id="topActions"></div>
    </header>

    <section class="hero" id="hero" aria-label="Ringkasan"></section>

    <section class="tools" aria-label="Cari dan saring">
      <div class="search">
        <span id="searchIcon"></span>
        <label class="sr" for="q">Cari surat</label>
        <input id="q" type="search" placeholder="Cari nomor, perihal, atau pengirim" autocomplete="off">
      </div>
      <label class="sr" for="fStatus">Saring status</label>
      <select id="fStatus" class="select"></select>
      <label class="sr" for="fSort">Urutkan</label>
      <select id="fSort" class="select">
        <option value="new">Terbaru dulu</option>
        <option value="old">Terlama dulu</option>
        <option value="az">Perihal A sampai Z</option>
      </select>
            <label class="sr" for="fDay">Tanggal</label>
      <select id="fDay" class="select dt"></select>
      <label class="sr" for="fMonth">Bulan</label>
      <select id="fMonth" class="select dt"></select>
      <label class="sr" for="fYear">Tahun</label>
      <select id="fYear" class="select dt"></select>
    </section>

    <section class="list" id="list" aria-live="polite"></section>
  </main>
</div>

<div id="drawerRoot"></div>
<div id="modalRoot"></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="login.js"></script>

<script>
(() => {
'use strict';

/* ================= util ================= */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, '0');
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const isoOffset = days => { const d = new Date(); d.setDate(d.getDate() + days); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const fmtDate = iso => {
  if (!iso) return '-';
  const [y, m, d] = iso.split('-').map(Number);
  if (!y) return '-';
  return new Date(y, m - 1, d).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
};
const fmtSize = b => b >= 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB';
const validId = id => /^[A-Za-z0-9_-]{6,64}$/.test(id || '');

const I = {
  inbox:'<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>',
  send:'<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',
  plus:'<path d="M5 12h14"/><path d="M12 5v14"/>',
  search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  clip:'<path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/>',
  edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
  trash:'<path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M10 11v6"/><path d="M14 11v6"/>',
  x:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/>',
  file:'<path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><path d="M14 2v6h6"/>',
  layers:'<path d="m12 2 10 5-10 5L2 7z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/>',
  clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  calendar:'<rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/>',
  external:'<path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',
  mail:'<rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  alert:'<circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/>',
  upload:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/>'
};
const ic = (n, s = 18) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]}</svg>`;

/* ================= konstanta ================= */
const STATUS = { masuk: ['Baru', 'Diproses', 'Selesai'], keluar: ['Draft', 'Terkirim', 'Dibalas'] };
const ALL_STATUS = [...STATUS.masuk, ...STATUS.keluar];
const ST_CLASS = { Baru:'st-warn', Diproses:'st-info', Selesai:'st-ok', Draft:'st-mute', Terkirim:'st-info', Dibalas:'st-ok' };
const SIFAT = ['Biasa', 'Penting', 'Segera', 'Rahasia'];
const TITLE = { all: 'Semua surat', masuk: 'Surat masuk', keluar: 'Surat keluar' };
const ACCEPT = '.pdf,.jpg,.jpeg,.png,.webp,.gif,.txt,.csv';
const MAX_BYTES = 10 * 1048576;
const TYPE_BY_EXT = { pdf:'application/pdf', jpg:'image/jpeg', jpeg:'image/jpeg', png:'image/png', webp:'image/webp', gif:'image/gif', txt:'text/plain', csv:'text/csv' };
const LS_KEY = 'arsip-surat:v1';

/* ================= state ================= */
const S = {
  letters: [], ready: false, db: null, assets: null, downloads: null,
    tab: 'all', status: 'all', sort: 'new', q: '', day: 'all', month: 'all', year: 'all',
  drawerId: null
};
let M = null; // state form
let lastFocus = { drawer: null, modal: null };

/* ================= penyimpanan lokal (cadangan) ================= */
function lsLoad(){ try { return JSON.parse(localStorage.getItem(LS_KEY) || '[]'); } catch { return []; } }
function lsSave(){ try { localStorage.setItem(LS_KEY, JSON.stringify(S.letters)); } catch { toast('Penyimpanan browser tidak bisa dipakai.', 'err'); } }

function idbOpen(){
  return new Promise((res, rej) => {
    const r = indexedDB.open('arsip-surat', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('files');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function idbPut(k, v){ const d = await idbOpen(); return new Promise((res, rej) => { const t = d.transaction('files', 'readwrite'); t.objectStore('files').put(v, k); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); }
async function idbGet(k){ const d = await idbOpen(); return new Promise((res, rej) => { const r = d.transaction('files').objectStore('files').get(k); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function idbDel(k){ const d = await idbOpen(); return new Promise((res, rej) => { const t = d.transaction('files', 'readwrite'); t.objectStore('files').delete(k); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); }

/* ================= repositori ================= */
async function saveLetter(l){
  const clean = JSON.parse(JSON.stringify(l));
  if (S.db) { await S.db.doc('letters/' + l.id).set(clean); return; }
  const i = S.letters.findIndex(x => x.id === l.id);
  if (i >= 0) S.letters[i] = clean; else S.letters.push(clean);
  lsSave();
}
async function removeLetter(l){
  if (S.db) { await S.db.doc('letters/' + l.id).delete(); return; }
  S.letters = S.letters.filter(x => x.id !== l.id);
  lsSave();
}
const guessType = f => f.type && !f.type.includes(';') ? f.type : (TYPE_BY_EXT[(f.name.split('.').pop() || '').toLowerCase()] || '');
async function uploadFile(f){
  const type = guessType(f);
  if (S.assets) {
    const r = await S.assets.upload(f, { type });
    return { id: r.id, name: f.name, type, size: r.sizeBytes, store: 'asset' };
  }
  const id = 'f' + uid();
  await idbPut(id, f);
  return { id, name: f.name, type, size: f.size, store: 'idb' };
}
async function deleteFile(fl){
  if (!fl) return;
  try {
    if (fl.store === 'asset' && S.assets) await S.assets.delete(fl.id);
    else if (fl.store === 'idb') await idbDel(fl.id);
  } catch {}
}
const canUpload = () => !!S.assets || !S.db;
const fileUrl = fl => fl && fl.store === 'asset' && validId(fl.id) ? '/_blob/' + fl.id : null;

/* ================= turunan data ================= */
function suggestAgenda(j, tgl, extra = []){
  const p = j === 'masuk' ? 'M' : 'K';
  const y = (tgl || todayISO()).slice(0, 4);
  let max = 0;
  S.letters.concat(extra).forEach(l => {
    const m = String(l.agenda || '').match(/^([MK])-(\d+)\/(\d{4})$/);
    if (m && m[1] === p && m[3] === y) max = Math.max(max, +m[2]);
  });
  return `${p}-${pad(max + 1).padStart(3, '0')}/${y}`;
}
const BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
function dateMatch(l){
  const [y, m, d] = String(l.tglSurat || '').split('-');
  if (S.year !== 'all' && y !== S.year) return false;
  if (S.month !== 'all' && m !== S.month) return false;
  if (S.day !== 'all' && d !== S.day) return false;
  return true;
}
function renderDateOptions(){
  const years = [...new Set(S.letters.map(l => (l.tglSurat || '').slice(0, 4)).filter(Boolean).concat(String(new Date().getFullYear())))].sort().reverse();
  if (S.year !== 'all' && !years.includes(S.year)) S.year = 'all';
  const opt = (v, t, cur) => `<option value="${v}" ${cur === v ? 'selected' : ''}>${t}</option>`;
  $('#fDay').innerHTML = opt('all', 'Semua tanggal', S.day) + Array.from({ length: 31 }, (_, i) => opt(pad(i + 1), i + 1, S.day)).join('');
  $('#fMonth').innerHTML = opt('all', 'Semua bulan', S.month) + BULAN.map((b, i) => opt(pad(i + 1), b, S.month)).join('');
  $('#fYear').innerHTML = opt('all', 'Semua tahun', S.year) + years.map(y => opt(y, y, S.year)).join('');
}
function visible(){
  const q = S.q.trim().toLowerCase();
  let r = S.letters.filter(l => (S.tab === 'all' || l.jenis === S.tab)
    && (S.status === 'all' || l.status === S.status)
        && dateMatch(l)
    && (!q || [l.nomor, l.agenda, l.perihal, l.pihak, l.ringkasan, l.catatan].some(v => String(v || '').toLowerCase().includes(q))));
  const byDate = (a, b) => (b.tglSurat || '').localeCompare(a.tglSurat || '') || (b.createdAt || 0) - (a.createdAt || 0);
  if (S.sort === 'new') r.sort(byDate);
  else if (S.sort === 'old') r.sort((a, b) => -byDate(a, b));
  else r.sort((a, b) => String(a.perihal).localeCompare(String(b.perihal), 'id'));
  return r;
}
const find = id => S.letters.find(l => l.id === id);

/* ================= render ================= */
function greeting(){
  const h = new Date().getHours();
  const g = h < 11 ? 'Selamat pagi' : h < 15 ? 'Selamat siang' : h < 18 ? 'Selamat sore' : 'Selamat malam';
  return `${g}, ${new Date().toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}`;
}
function renderChrome(){
  $('#brandMark').innerHTML = ic('mail', 22);
  $('#searchIcon').innerHTML = ic('search', 18);
  $('#hello').textContent = greeting();
  $('#pageTitle').textContent = TITLE[S.tab];
  const cm = S.letters.filter(l => l.jenis === 'masuk').length;
  const ck = S.letters.filter(l => l.jenis === 'keluar').length;
  const items = [['all', 'Semua surat', 'layers', cm + ck], ['masuk', 'Surat masuk', 'inbox', cm], ['keluar', 'Surat keluar', 'send', ck]];
  $('#nav').innerHTML = items.map(([k, t, i, c]) =>
    `<button type="button" data-act="tab" data-tab="${k}" ${S.tab === k ? 'aria-current="page"' : ''}>${ic(i, 19)}<span>${t}</span><span class="count">${c}</span></button>`).join('');
  const acts = [];
  if (S.downloads && S.letters.length) acts.push(`<button type="button" class="btn" data-act="export">${ic('download', 17)}Ekspor CSV</button>`);
  acts.push(`<button type="button" class="btn primary" data-act="add">${ic('plus', 17)}Tambah surat</button>`);
  $('#topActions').innerHTML = acts.join('');
    $('#topActions').innerHTML = acts.join('');
  renderStatusOptions();
  renderDateOptions();
}
function renderStatusOptions(){
  renderStatusOptions();
}
function renderStatusOptions(){
  const opts = S.tab === 'all' ? ALL_STATUS : STATUS[S.tab];
  if (S.status !== 'all' && !opts.includes(S.status)) S.status = 'all';
  $('#fStatus').innerHTML = `<option value="all">Semua status</option>` + opts.map(o => `<option ${S.status === o ? 'selected' : ''}>${o}</option>`).join('');
  
}
function renderHero(){
  const L = S.letters;
  const now = new Date(); const ym = `${now.getFullYear()}-${pad(now.getMonth() + 1)}`;
  const cm = L.filter(l => l.jenis === 'masuk').length;
  const ck = L.filter(l => l.jenis === 'keluar').length;
  const bulan = L.filter(l => (l.tglSurat || '').startsWith(ym)).length;
  const pending = L.filter(l => l.status === 'Baru' || l.status === 'Diproses' || l.status === 'Draft').length;
  const stat = (cls, icon, n, label) => `<div class="stat"><div class="ico ${cls}">${ic(icon, 22)}</div><div><b>${n}</b><span>${label}</span></div></div>`;

  const months = [];
  for (let i = 5; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const key = `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
    months.push({ key, label: d.toLocaleDateString('id-ID', { month: 'short' }),
      in: L.filter(l => l.jenis === 'masuk' && (l.tglSurat || '').startsWith(key)).length,
      out: L.filter(l => l.jenis === 'keluar' && (l.tglSurat || '').startsWith(key)).length });
  }
  const max = Math.max(1, ...months.map(m => Math.max(m.in, m.out)));
  const h = n => n ? Math.max(8, Math.round(n / max * 100)) : 0;
  const bars = months.map(m => `<div class="bcol" role="img" aria-label="${m.label}: ${m.in} masuk, ${m.out} keluar">
      <div class="bpair"><span class="bar in ${m.in ? '' : 'zero'}" style="height:${m.in ? h(m.in) + '%' : '3px'}"></span><span class="bar out ${m.out ? '' : 'zero'}" style="height:${m.out ? h(m.out) + '%' : '3px'}"></span></div>
      <span class="blabel">${m.label}</span></div>`).join('');

  $('#hero').innerHTML = `
    <div class="stats">
      ${stat('masuk', 'inbox', cm, 'Surat masuk')}
      ${stat('keluar', 'send', ck, 'Surat keluar')}
      ${stat('info', 'calendar', bulan, 'Surat bulan ini')}
      ${stat('warn', 'clock', pending, 'Perlu tindak lanjut')}
    </div>
    <div class="chart">
      <h2>Aktivitas 6 bulan terakhir</h2>
      <div class="legend"><span><i style="background:var(--masuk)"></i>Masuk</span><span><i style="background:var(--keluar)"></i>Keluar</span></div>
      <div class="bars">${bars}</div>
    </div>`;
}
function rowHTML(l){
  const m = l.jenis === 'masuk';
  const sifat = l.sifat && l.sifat !== 'Biasa' && SIFAT.includes(l.sifat) ? `<span class="tag ${esc(l.sifat)}">${esc(l.sifat)}</span>` : '';
  const stc = ST_CLASS[l.status] || 'st-mute';
  return `<article class="row" data-id="${esc(l.id)}">
    <div class="tile ${esc(l.jenis)}">${ic(m ? 'inbox' : 'send', 21)}</div>
    <div class="r-main"><h3><button type="button" class="title-btn" data-act="open" data-id="${esc(l.id)}">${esc(l.perihal)}</button></h3><p>${esc(l.nomor)}</p></div>
    <div class="r-party"><span class="pfx">${m ? 'Dari' : 'Kepada'}</span><span class="pname">${esc(l.pihak)}</span></div>
    <div class="r-date">${fmtDate(l.tglSurat)}</div>
    <div class="r-stat"><span class="chip ${stc}">${esc(l.status)}</span>${sifat}${l.file ? `<span class="clip" title="Ada lampiran">${ic('clip', 16)}<span class="sr">Ada lampiran</span></span>` : ''}</div>
    <div class="r-acts">
      <button type="button" class="icon-btn" data-act="edit" data-id="${esc(l.id)}" aria-label="Ubah surat ${esc(l.perihal)}">${ic('edit', 17)}</button>
      <button type="button" class="icon-btn del" data-act="del" data-id="${esc(l.id)}" aria-label="Hapus surat ${esc(l.perihal)}">${ic('trash', 17)}</button>
    </div></article>`;
}
function renderList(){
  const el = $('#list');
  if (!S.ready) { el.innerHTML = '<div class="skel"><i></i><i></i><i></i><i></i></div>'; return; }
  if (!S.letters.length) {
    el.innerHTML = `<div class="empty"><div class="art">${ic('mail', 34)}</div>
      <h2>Arsip masih kosong</h2>
      <p>Catat surat masuk dan surat keluar, lalu lampirkan file scan atau PDF-nya supaya mudah dicari kembali.</p>
      <div class="btns"><button type="button" class="btn primary" data-act="add">${ic('plus', 17)}Tambah surat pertama</button>
      <button type="button" class="btn" data-act="sample">Coba dengan contoh data</button></div></div>`;
    return;
  }
  const rows = visible();
  if (!rows.length) {
    el.innerHTML = `<div class="empty"><div class="art">${ic('search', 32)}</div><h2>Tidak ada surat yang cocok</h2>
      <p>Coba kata kunci lain atau hapus saringan yang sedang aktif.</p>
      <div class="btns"><button type="button" class="btn" data-act="reset">Reset pencarian</button></div></div>`;
    return;
  }
  el.innerHTML = `<div class="thead" aria-hidden="true"><span></span><span>Perihal</span><span>Asal atau tujuan</span><span>Tanggal</span><span>Status</span><span></span></div>` + rows.map(rowHTML).join('');
}
function render(){
  renderChrome(); renderHero(); renderList();
  if (S.drawerId) { const l = find(S.drawerId); if (l) fillDrawer(l); else closeDrawer(true); }
}

/* ================= toast ================= */
function toast(msg, kind = 'ok'){
  const t = document.createElement('div');
  t.className = 'toast ' + kind;
  t.innerHTML = (kind === 'err' ? ic('alert', 18) : ic('check', 18)) + `<span>${esc(msg)}</span>`;
  $('#toasts').appendChild(t);
  setTimeout(() => t.remove(), 3800);
}
function errMsg(e){
  const c = e && e.code;
  if (c === 'too_large') return 'Ukuran file terlalu besar.';
  if (c === 'unsupported_type') return 'Jenis file tidak didukung. Gunakan PDF atau gambar.';
  if (c === 'quota_or_state' || c === 'quota_exceeded') return 'Penyimpanan penuh. Hapus surat atau lampiran lama dulu.';
  if (c === 'rate_limited' || c === 'resource_exhausted') return 'Terlalu cepat. Tunggu sebentar lalu coba lagi.';
  if (c === 'invalid_argument' || c === 'not_granted') return 'Perubahan tidak tersimpan. Akses kamu mungkin hanya untuk melihat.';
  return 'Gagal menyimpan. Coba lagi.';
}

/* ================= layer ================= */
function syncScroll(){ document.body.style.overflow = ($('#drawerRoot').children.length || $('#modalRoot').children.length) ? 'hidden' : ''; }
function trap(root, e){
  if (e.key !== 'Tab') return;
  const f = [...root.querySelectorAll('button:not([disabled]),input:not([disabled]):not([type=hidden]),select,textarea,a[href]')].filter(x => x.offsetParent !== null || x === document.activeElement);
  if (!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
}
function closeModal(){ $('#modalRoot').innerHTML = ''; M = null; syncScroll(); if (lastFocus.modal && document.contains(lastFocus.modal)) lastFocus.modal.focus(); }
function closeDrawer(silent){ $('#drawerRoot').innerHTML = ''; S.drawerId = null; syncScroll(); if (!silent && lastFocus.drawer && document.contains(lastFocus.drawer)) lastFocus.drawer.focus(); }
function closeTop(){ if ($('#modalRoot').children.length) closeModal(); else if ($('#drawerRoot').children.length) closeDrawer(); }

/* ---------- drawer detail ---------- */
function openDrawer(id, origin){
  const l = find(id); if (!l) return;
  lastFocus.drawer = origin || document.activeElement;
  S.drawerId = id;
  $('#drawerRoot').innerHTML = `<div class="scrim right"><aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="dt"></aside></div>`;
  fillDrawer(l); syncScroll();
  $('#drawerRoot .icon-btn').focus();
}
function fillDrawer(l){
  const box = $('#drawerRoot .drawer'); if (!box) return;
  const m = l.jenis === 'masuk';
  const sifat = l.sifat && l.sifat !== 'Biasa' && SIFAT.includes(l.sifat) ? `<span class="tag ${esc(l.sifat)}">${esc(l.sifat)}</span>` : '';
  const fact = (k, v, wide) => `<div class="${wide ? 'wide' : ''}"><dt>${k}</dt><dd>${esc(v || '-')}</dd></div>`;
  let att = '';
  if (l.file) {
    const url = fileUrl(l.file);
    const isImg = /^image\//.test(l.file.type || '');
    const preview = isImg ? (url
      ? `<a class="att-img" href="${url}" target="_blank" rel="noopener"><img src="${url}" alt="Pratinjau lampiran ${esc(l.file.name)}"></a>`
      : `<div class="att-img"><img data-idb="${esc(l.file.id)}" alt="Pratinjau lampiran ${esc(l.file.name)}"></div>`) : '';
    const actions = url
      ? `<a class="btn" href="${url}" target="_blank" rel="noopener">${ic('external', 16)}Buka file</a><a class="btn" href="${url}" download="${esc(l.file.name)}">${ic('download', 16)}Unduh</a>`
      : `<button type="button" class="btn" data-act="idb-open" data-fid="${esc(l.file.id)}">${ic('external', 16)}Buka file</button>`;
    att = `<div class="sect"><h3>Lampiran</h3>${preview}
      <div class="filechip" style="margin-bottom:10px"><div class="fi">${ic('file', 20)}</div><div class="fn"><b>${esc(l.file.name)}</b><span>${fmtSize(l.file.size || 0)}</span></div></div>
      <div class="att-actions">${actions}</div></div>`;
  } else {
    att = `<div class="sect"><h3>Lampiran</h3><p style="color:var(--muted)">Belum ada file terlampir.</p></div>`;
  }
  box.innerHTML = `
    <div class="dhead ${esc(l.jenis)}"><span class="jenis">${ic(m ? 'inbox' : 'send', 20)}${m ? 'Surat masuk' : 'Surat keluar'}</span>
      <button type="button" class="icon-btn" data-act="close-drawer" aria-label="Tutup">${ic('x', 20)}</button></div>
    <div class="dbody">
      <div><h2 id="dt">${esc(l.perihal)}</h2>
        <div class="chips"><span class="chip ${ST_CLASS[l.status] || 'st-mute'}">${esc(l.status)}</span>${sifat}</div></div>
      <dl class="facts">
        ${fact('Nomor surat', l.nomor)}${fact('Nomor agenda', l.agenda)}
        ${fact('Tanggal surat', fmtDate(l.tglSurat))}${fact(m ? 'Tanggal diterima' : 'Tanggal dikirim', fmtDate(l.tglTerima))}
        ${fact(m ? 'Asal surat' : 'Tujuan surat', l.pihak, true)}
      </dl>
      ${l.ringkasan ? `<div class="sect"><h3>Ringkasan isi</h3><p>${esc(l.ringkasan)}</p></div>` : ''}
      ${l.catatan ? `<div class="sect"><h3>${m ? 'Disposisi atau catatan' : 'Catatan'}</h3><p>${esc(l.catatan)}</p></div>` : ''}
      ${att}
    </div>
    <div class="dfoot">
      <button type="button" class="btn primary" data-act="edit" data-id="${esc(l.id)}">${ic('edit', 16)}Ubah</button>
      <span class="grow"></span>
      <button type="button" class="btn ghost-danger" data-act="del" data-id="${esc(l.id)}">${ic('trash', 16)}Hapus</button>
    </div>`;
  const img = box.querySelector('img[data-idb]');
  if (img) idbGet(img.dataset.idb).then(b => { if (!b) return; const r = new FileReader(); r.onload = () => { img.src = r.result; }; r.readAsDataURL(b); }).catch(() => {});
}

/* ---------- form tambah / ubah ---------- */
function fieldErr(name, on){
  const f = $(`#f-${name}`); if (!f) return;
  f.classList.toggle('bad', on);
  const inp = f.querySelector('.field'); if (inp) inp.setAttribute('aria-invalid', on ? 'true' : 'false');
}
function openForm(id, origin){
  const l = id ? find(id) : null;
  lastFocus.modal = origin || document.activeElement;
  const base = l ? JSON.parse(JSON.stringify(l)) : {
    jenis: S.tab === 'keluar' ? 'keluar' : 'masuk', nomor: '', agenda: '', tglSurat: todayISO(), tglTerima: todayISO(),
    pihak: '', perihal: '', sifat: 'Biasa', status: '', ringkasan: '', catatan: '', file: null
  };
  if (!base.status) base.status = STATUS[base.jenis][0];
  if (!l) base.agenda = suggestAgenda(base.jenis, base.tglSurat);
  M = { id: l ? l.id : null, createdAt: l ? l.createdAt : null, file: base.file, newFile: null, removeFile: false, agendaTouched: !!l, busy: false, v: base };

  const v = base;
  $('#modalRoot').innerHTML = `<div class="scrim"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt">
    <div class="mhead"><h2 id="mt">${l ? 'Ubah surat' : 'Tambah surat'}</h2><button type="button" class="icon-btn" data-act="close-modal" aria-label="Tutup">${ic('x', 20)}</button></div>
    <form id="lform" novalidate>
      <div class="mbody">
        <div class="fld"><span class="lbl" id="jl">Jenis surat</span>
          <div class="seg" role="radiogroup" aria-labelledby="jl">
            <label><input type="radio" name="jenis" value="masuk" ${v.jenis === 'masuk' ? 'checked' : ''}><span class="m">${ic('inbox', 18)}Surat masuk</span></label>
            <label><input type="radio" name="jenis" value="keluar" ${v.jenis === 'keluar' ? 'checked' : ''}><span class="k">${ic('send', 18)}Surat keluar</span></label>
          </div></div>
        <div class="grid2">
          <div class="fld" id="f-nomor"><label for="nomor">Nomor surat</label><input class="field" id="nomor" name="nomor" maxlength="80" value="${esc(v.nomor)}" placeholder="Contoh: 045/UND/IX/2026" autocomplete="off"><div class="err">Isi nomor surat.</div></div>
          <div class="fld" id="f-agenda"><label for="agenda">Nomor agenda</label><input class="field" id="agenda" name="agenda" maxlength="40" value="${esc(v.agenda)}" autocomplete="off"><div class="hint">Terisi otomatis, boleh diubah.</div></div>
        </div>
        <div class="grid2">
          <div class="fld" id="f-tglSurat"><label for="tglSurat">Tanggal surat</label><input class="field" type="date" id="tglSurat" name="tglSurat" value="${esc(v.tglSurat)}"><div class="err">Pilih tanggal surat.</div></div>
          <div class="fld"><label for="tglTerima" id="lbl-tgl2">Tanggal diterima</label><input class="field" type="date" id="tglTerima" name="tglTerima" value="${esc(v.tglTerima)}"></div>
        </div>
        <div class="fld" id="f-pihak"><label for="pihak" id="lbl-pihak">Asal surat (pengirim)</label><input class="field" id="pihak" name="pihak" maxlength="120" value="${esc(v.pihak)}" autocomplete="off"><div class="err">Isi nama instansi atau orangnya.</div></div>
        <div class="fld" id="f-perihal"><label for="perihal">Perihal</label><input class="field" id="perihal" name="perihal" maxlength="200" value="${esc(v.perihal)}" placeholder="Contoh: Undangan rapat koordinasi" autocomplete="off"><div class="err">Isi perihal surat.</div></div>
        <div class="grid2">
          <div class="fld"><label for="sifat">Sifat surat</label><select class="field" id="sifat" name="sifat">${SIFAT.map(s => `<option ${v.sifat === s ? 'selected' : ''}>${s}</option>`).join('')}</select></div>
          <div class="fld"><label for="status">Status</label><select class="field" id="status" name="status"></select></div>
        </div>
        <div class="fld"><label for="ringkasan">Ringkasan isi</label><textarea class="field" id="ringkasan" name="ringkasan" maxlength="2000" placeholder="Tulis inti isi surat secara singkat">${esc(v.ringkasan)}</textarea></div>
        <div class="fld"><label for="catatan" id="lbl-cat">Disposisi atau catatan</label><textarea class="field" id="catatan" name="catatan" maxlength="2000">${esc(v.catatan)}</textarea></div>
        <div class="fld"><span class="lbl">Lampiran</span><div id="fileArea"></div></div>
      </div>
      <div class="mfoot"><button type="button" class="btn" data-act="close-modal">Batal</button><button type="submit" class="btn primary" id="saveBtn">${ic('check', 17)}Simpan surat</button></div>
    </form></div></div>`;
  syncScroll();
  applyJenis(true);
  renderFileArea();
  $('#nomor').focus();
}
function applyJenis(initial){
  const j = $('input[name=jenis]:checked').value, m = j === 'masuk';
  $('#lbl-pihak').textContent = m ? 'Asal surat (pengirim)' : 'Tujuan surat (penerima)';
  $('#lbl-tgl2').textContent = m ? 'Tanggal diterima' : 'Tanggal dikirim';
  $('#lbl-cat').textContent = m ? 'Disposisi atau catatan' : 'Catatan';
  $('#pihak').placeholder = m ? 'Contoh: Dinas Pendidikan' : 'Contoh: PT Maju Bersama';
  const sel = $('#status'); const cur = initial ? M.v.status : sel.value;
  sel.innerHTML = STATUS[j].map(s => `<option>${s}</option>`).join('');
  sel.value = STATUS[j].includes(cur) ? cur : STATUS[j][0];
  if (!M.agendaTouched) $('#agenda').value = suggestAgenda(j, $('#tglSurat').value);
}
function renderFileArea(){
  const a = $('#fileArea'); if (!a) return;
  if (!canUpload()) { a.innerHTML = `<div class="notice">Unggah lampiran hanya tersedia untuk akun yang bisa mengedit arsip ini.</div>`; return; }
  const cur = M.newFile ? { name: M.newFile.name, size: M.newFile.size, fresh: true } : (M.file && !M.removeFile ? { name: M.file.name, size: M.file.size } : null);
  if (cur) {
    a.innerHTML = `<div class="filechip"><div class="fi">${ic('file', 20)}</div><div class="fn"><b>${esc(cur.name)}</b><span>${fmtSize(cur.size || 0)}${cur.fresh ? ' - akan diunggah saat disimpan' : ''}</span></div>
      <button type="button" class="icon-btn del" data-act="file-remove" aria-label="Hapus lampiran">${ic('trash', 17)}</button></div>`;
  } else {
    a.innerHTML = `<div class="drop" id="drop"><div style="color:var(--muted);margin-bottom:6px">${ic('upload', 26)}</div>
      Tarik file ke sini atau <button type="button" class="linkbtn" data-act="file-pick">pilih dari perangkat</button>
      <small>PDF, gambar, atau teks. Maksimal 10 MB.</small>
      <input type="file" id="fileInput" accept="${ACCEPT}" hidden></div>`;
    const drop = $('#drop'), inp = $('#fileInput');
    inp.addEventListener('change', () => { if (inp.files[0]) takeFile(inp.files[0]); });
    ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
    ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
    drop.addEventListener('drop', e => { const f = e.dataTransfer && e.dataTransfer.files[0]; if (f) takeFile(f); });
  }
}
function takeFile(f){
  const type = guessType(f);
  if (!Object.values(TYPE_BY_EXT).includes(type)) { toast('Jenis file tidak didukung. Gunakan PDF, gambar, atau teks.', 'err'); return; }
  if (f.size > MAX_BYTES) { toast('Ukuran file melebihi 10 MB.', 'err'); return; }
  if (!f.size) { toast('File kosong.', 'err'); return; }
  M.newFile = f; renderFileArea();
}
async function submitForm(){
  if (!M || M.busy) return;
  const g = n => ($(`#lform [name=${n}]`).value || '').trim();
  const v = { jenis: $('input[name=jenis]:checked').value, nomor: g('nomor'), agenda: g('agenda'), tglSurat: g('tglSurat'), tglTerima: g('tglTerima'),
    pihak: g('pihak'), perihal: g('perihal'), sifat: g('sifat'), status: g('status'), ringkasan: g('ringkasan'), catatan: g('catatan') };
  const bad = { nomor: !v.nomor, tglSurat: !v.tglSurat, pihak: !v.pihak, perihal: !v.perihal };
  Object.keys(bad).forEach(k => fieldErr(k, bad[k]));
  const firstBad = Object.keys(bad).find(k => bad[k]);
  if (firstBad) { $(`#${firstBad}`).focus(); return; }

  M.busy = true;
  const btn = $('#saveBtn'); btn.disabled = true; btn.textContent = M.newFile ? 'Mengunggah...' : 'Menyimpan...';
  let uploaded = null;
  try {
    let file = M.removeFile ? null : M.file, old = null;
    if (M.newFile) { uploaded = await uploadFile(M.newFile); old = M.file; file = uploaded; }
    else if (M.removeFile) old = M.file;
    const now = Date.now();
    const rec = { id: M.id || uid(), ...v, file, createdAt: M.createdAt || now, updatedAt: now };
    await saveLetter(rec);
    if (old) await deleteFile(old);
    const wasEdit = !!M.id;
    closeModal();
    toast(wasEdit ? 'Perubahan disimpan' : 'Surat ditambahkan');
    if (!S.db) render();
  } catch (e) {
    if (uploaded) await deleteFile(uploaded);
    toast(errMsg(e), 'err');
    if ($('#saveBtn')) { $('#saveBtn').disabled = false; $('#saveBtn').innerHTML = ic('check', 17) + 'Simpan surat'; }
    if (M) M.busy = false;
  }
}

/* ---------- hapus ---------- */
function openConfirm(id, origin){
  const l = find(id); if (!l) return;
  lastFocus.modal = origin || document.activeElement;
  $('#modalRoot').innerHTML = `<div class="scrim"><div class="modal small" role="alertdialog" aria-modal="true" aria-labelledby="ct" aria-describedby="cd">
    <div class="mhead"><h2 id="ct">Hapus surat ini?</h2><button type="button" class="icon-btn" data-act="close-modal" aria-label="Tutup">${ic('x', 20)}</button></div>
    <div class="mbody"><p id="cd"><b>${esc(l.perihal)}</b><br><span style="color:var(--muted)">${esc(l.nomor)}</span></p>
      <p style="color:var(--muted)">Surat${l.file ? ' dan lampirannya' : ''} akan dihapus permanen dan tidak bisa dikembalikan.</p></div>
    <div class="mfoot"><button type="button" class="btn" data-act="close-modal">Batal</button><button type="button" class="btn danger" id="confirmDel" data-act="confirm-del" data-id="${esc(l.id)}">Hapus surat</button></div>
  </div></div>`;
  syncScroll(); $('#modalRoot .btn').focus();
}
async function doDelete(id){
  const l = find(id); if (!l) { closeModal(); return; }
  const b = $('#confirmDel'); if (b) { b.disabled = true; b.textContent = 'Menghapus...'; }
  try {
    await removeLetter(l);
    await deleteFile(l.file);
    closeModal(); if (S.drawerId === id) closeDrawer(true);
    toast('Surat dihapus');
    if (!S.db) render();
  } catch (e) { toast(errMsg(e), 'err'); if (b) { b.disabled = false; b.textContent = 'Hapus surat'; } }
}

/* ---------- contoh data & ekspor ---------- */
async function addSamples(){
  const mk = (jenis, off, nomor, pihak, perihal, sifat, status, ringkasan, catatan) => ({ jenis, tglSurat: isoOffset(off), tglTerima: isoOffset(off + (jenis === 'masuk' ? 1 : 0)), nomor, pihak, perihal, sifat, status, ringkasan, catatan, file: null });
  const list = [
    mk('masuk', -2, '045/UND/DIKBUD/IX/2026', 'Dinas Pendidikan dan Kebudayaan', 'Undangan rapat koordinasi program tahunan', 'Segera', 'Baru', 'Mengundang pimpinan untuk hadir dalam rapat koordinasi penyusunan program kerja tahun depan.', ''),
    mk('masuk', -11, '112/PEM/KEC/IX/2026', 'Kantor Kecamatan', 'Permohonan data penerima bantuan', 'Penting', 'Diproses', 'Meminta rekap data penerima bantuan semester berjalan paling lambat akhir bulan.', 'Disposisi ke bagian data.'),
    mk('keluar', -5, '078/SK/KEP/IX/2026', 'Seluruh unit kerja', 'Surat keputusan pembentukan panitia kegiatan', 'Biasa', 'Terkirim', 'Menetapkan susunan panitia pelaksana kegiatan akhir tahun.', ''),
    mk('keluar', -24, '061/TGS/VIII/2026', 'Bapak Ahmad Fauzi', 'Surat tugas perjalanan dinas', 'Biasa', 'Dibalas', 'Penugasan menghadiri pelatihan di luar kota selama tiga hari.', ''),
    mk('masuk', -47, '203/PNW/VIII/2026', 'PT Sinar Mandiri', 'Penawaran pengadaan perlengkapan kantor', 'Biasa', 'Selesai', 'Penawaran harga perlengkapan kantor beserta syarat pembayaran.', 'Sudah dibahas, ditunda.'),
    mk('keluar', -70, '034/KET/VII/2026', 'Dinas Sosial', 'Balasan permohonan kerja sama', 'Penting', 'Dibalas', 'Menyatakan kesediaan bekerja sama dan mengusulkan jadwal pertemuan.', '')
  ];
  const btn = document.querySelector('[data-act=sample]'); if (btn) btn.disabled = true;
  try {
    const made = [];
    for (const s of list) {
      const rec = { id: uid(), ...s, agenda: suggestAgenda(s.jenis, s.tglSurat, made), createdAt: Date.now(), updatedAt: Date.now() };
      made.push(rec);
      await saveLetter(rec);
    }
    if (!S.db) render();
    toast('Contoh data ditambahkan');
  } catch (e) { toast(errMsg(e), 'err'); if (btn) btn.disabled = false; }
}
async function exportCSV(){
  if (!S.downloads) return;
  const cols = ['Jenis', 'Nomor surat', 'Nomor agenda', 'Tanggal surat', 'Tanggal diterima/dikirim', 'Asal/tujuan', 'Perihal', 'Sifat', 'Status', 'Ringkasan', 'Catatan', 'Lampiran'];
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const rows = [...S.letters].sort((a, b) => (b.tglSurat || '').localeCompare(a.tglSurat || '')).map(l =>
    [l.jenis === 'masuk' ? 'Masuk' : 'Keluar', l.nomor, l.agenda, l.tglSurat, l.tglTerima, l.pihak, l.perihal, l.sifat, l.status, l.ringkasan, l.catatan, l.file ? l.file.name : ''].map(q).join(','));
  try { await S.downloads.save({ filename: `arsip-surat-${todayISO()}.csv`, data: '\ufeff' + [cols.map(q).join(','), ...rows].join('\r\n') }); toast('Arsip diekspor'); }
  catch (e) { if (!e || e.code !== 'declined') toast('Ekspor belum berhasil. Coba lagi.', 'err'); }
}

/* ================= event ================= */
document.addEventListener('click', async e => {
  if (e.target.classList && e.target.classList.contains('scrim')) { closeTop(); return; }
  const el = e.target.closest('[data-act]');
  if (!el) { const row = e.target.closest('.row'); if (row) openDrawer(row.dataset.id, row.querySelector('.title-btn')); return; }
  const id = el.dataset.id;
  switch (el.dataset.act) {
    case 'tab': S.tab = el.dataset.tab; S.status = 'all'; render(); break;
    case 'add': openForm(null, el); break;
    case 'edit': if ($('#drawerRoot').children.length) closeDrawer(true); openForm(id, el); break;
    case 'del': openConfirm(id, el); break;
    case 'open': openDrawer(id, el); break;
    case 'close-drawer': closeDrawer(); break;
    case 'close-modal': closeModal(); break;
    case 'confirm-del': doDelete(id); break;
    case 'sample': addSamples(); break;
    case 'export': exportCSV(); break;
        case 'reset': S.q = ''; S.status = 'all'; S.day = S.month = S.year = 'all'; $('#q').value = ''; renderStatusOptions(); renderDateOptions(); renderList(); break;
    case 'file-pick': $('#fileInput').click(); break;
    case 'file-remove': if (M.newFile) M.newFile = null; else M.removeFile = true; renderFileArea(); break;
    case 'idb-open': {
      try { const b = await idbGet(el.dataset.fid); if (!b) throw 0; const w = window.open(URL.createObjectURL(b), '_blank'); if (!w) toast('Browser memblokir jendela baru.', 'err'); }
      catch { toast('File tidak bisa dibuka.', 'err'); }
      break;
    }
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && (e.target.closest && !e.defaultPrevented)) { if ($('#modalRoot').children.length || $('#drawerRoot').children.length) { e.preventDefault(); closeTop(); } return; }
  const mr = $('#modalRoot .modal'), dr = $('#drawerRoot .drawer');
  if (mr) trap(mr, e); else if (dr) trap(dr, e);
});
document.addEventListener('change', e => {
  if (e.target.name === 'jenis' && M) applyJenis(false);
  if (e.target.id === 'tglSurat' && M && !M.agendaTouched) $('#agenda').value = suggestAgenda($('input[name=jenis]:checked').value, e.target.value);
});
document.addEventListener('input', e => { if (e.target.id === 'agenda' && M) M.agendaTouched = true; });
document.addEventListener('submit', e => { e.preventDefault(); if (e.target.id === 'lform') submitForm(); });
$('#q').addEventListener('input', e => { S.q = e.target.value; renderList(); });
$('#fStatus').addEventListener('change', e => { S.status = e.target.value; renderList(); });
$('#fSort').addEventListener('change', e => { S.sort = e.target.value; renderList(); });
[['fDay', 'day'], ['fMonth', 'month'], ['fYear', 'year']].forEach(([id, k]) =>
  $('#' + id).addEventListener('change', e => { S[k] = e.target.value; renderList(); }));

/* ================= mulai ================= */
async function boot(){
  renderChrome(); renderHero(); renderList();
  let db = null, assets = null, dl = null;
  if (window.claude && typeof window.claude.use === 'function') {
    const get = n => Promise.resolve().then(() => window.claude.use(n)).catch(() => null);
    [db, assets, dl] = await Promise.all([get('db'), get('assets'), get('downloads')]);
  }
  S.db = db; S.assets = db ? assets : null; S.downloads = dl;
  if (db) {
    db.collection('letters').onSnapshot(snap => {
      S.letters = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      S.ready = true; render();
    }, () => { S.ready = true; render(); toast('Arsip gagal dimuat. Muat ulang halaman.', 'err'); });
  } else {
    S.letters = lsLoad(); S.ready = true; render();
  }
}
boot();
})();
</script>
